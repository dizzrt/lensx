name: Desktop Rust checks

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-rust-check.yml'
      - 'src-tauri/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-rust-check.yml'
      - 'src-tauri/**'

permissions:
  contents: read

jobs:
  cargo-check:
    name: Cargo check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust workspace
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace
