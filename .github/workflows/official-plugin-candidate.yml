name: Official plugin candidate and release

on:
  push:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '.github/workflows/official-plugin-*.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/plugin-*/**'
      - 'plugins/**'
      - 'scripts/official-plugin-release.ts'
      - 'scripts/official-plugin-release/**'
      - 'src/app/plugins/**'
      - 'src-tauri/src/plugin_*.rs'

permissions: {}

concurrency:
  group: official-plugin-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
    runs-on: macos-15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: plan
        run: echo "matrix=$(node --experimental-strip-types scripts/official-plugin-release.ts unreleased)" >> "$GITHUB_OUTPUT"

  platform-gate:
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:official-plugin-release-pipeline

  build:
    needs: [plan, platform-gate]
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    permissions:
      contents: read
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir packages/plugin-cli run build
      - run: >-
          node --experimental-strip-types scripts/official-plugin-release.ts candidate
          --plugin '${{ matrix.slug }}'
          --output 'artifacts/${{ matrix.slug }}'
      - run: >-
          node --experimental-strip-types scripts/official-plugin-release.ts verify-candidate
          --directory 'artifacts/${{ matrix.slug }}'
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-plugin-${{ matrix.slug }}-${{ github.sha }}
          path: artifacts/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.matrix != '{"include":[]}' }}
    permissions:
      contents: write
    environment: official-plugin-release
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-plugin-${{ matrix.slug }}-${{ github.sha }}
          path: candidate
      - run: node --experimental-strip-types scripts/official-plugin-release.ts verify-candidate --directory candidate
      - run: node --experimental-strip-types scripts/official-plugin-release.ts publish --directory candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
