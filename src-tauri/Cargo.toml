[package]
name = "lensx"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lensx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
plugin-development-mode = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
semver = "1"
sha2 = "=0.10.9"
tar = "=0.4.45"
url = "2"
zstd = "=0.13.3"
fs2 = "0.4"
getrandom = "=0.3.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2" }
objc2 = { version = "=0.6.4" }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["block2", "libc", "NSApplication", "NSCursor", "NSEvent", "NSGraphicsContext", "NSMenu", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSJSONSerialization", "NSObject", "NSString", "NSThread"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["block2", "WKContentWorld", "WKFrameInfo", "WKWebView"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
tauri = { path = "../vendor/frame-aware-navigation/tauri" }
tauri-runtime = { path = "../vendor/frame-aware-navigation/tauri-runtime" }
tauri-runtime-wry = { path = "../vendor/frame-aware-navigation/tauri-runtime-wry" }
wry = { path = "../vendor/frame-aware-navigation/wry" }
